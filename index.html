<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Happy Birthday</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    -webkit-text-size-adjust: 100%;
}

body {
    min-height: 100dvh;
    padding: 16px;
    display: flex;
    justify-content: center;
    overflow-x: hidden;
    font-family: Arial, sans-serif;
}

.page {

    width: min(100%, 430px);

    margin: 0 auto;
}

.title-image {

    display: block;

    width: 100%;

    height: auto;

    margin-bottom: 16px;
}

.card {

    position: relative;

    width: 100%;
}

.photo {

    display: block;

    width: 100%;

    height: auto;

    border-radius: 20px;

    transform: translate3d(0, 120%, 0);

    transition: transform 1s ease;
}

.photo.show {

    transform: translate3d(0, 0, 0);
}

.image-button {

    position: absolute;

    height: auto;

    cursor: pointer;

    transition: transform 1s ease;

    will-change: transform;
}

/*
    Меняй scale для каждой кнопки индивидуально.

    scale: 0.5 = уменьшить в 2 раза.
    scale: 0.33 = уменьшить примерно в 3 раза.
    scale: 0.25 = уменьшить в 4 раза.
*/

.button-1 {

    top: -3%;
    left: 8%;

    --scale: 0.75;
}

.button-2 {

    top: -3%;
    right: 10%;

    --scale: 0.75;
}

.button-3 {

    top: 9%;
    left: 3%;

    --scale: 0.75;
}

.button-4 {

    top: 9%;
    right: 3%;

    --scale: 0.75;
}

.button-5 {

    top: 20%;
    left: -3%;

    --scale: 0.75;
}

.button-6 {

    top: 20%;
    right: -3%;

    --scale: 0.75;
}

.hidden-left {

    transform:
        translate3d(-150vw, 0, 0)
        scale(var(--scale));
}

.hidden-right {

    transform:
        translate3d(150vw, 0, 0)
        scale(var(--scale));
}

.hidden-top {

    transform:
        translate3d(0, -150vh, 0)
        scale(var(--scale));
}

.hidden-bottom {

    transform:
        translate3d(0, 150vh, 0)
        scale(var(--scale));
}

.show-button {

    transform:
        translate3d(0, 0, 0)
        scale(var(--scale));
}

.overlay {

    position: fixed;

    inset: 0;

    display: none;

    justify-content: center;
    align-items: center;

    padding: 20px;

    background: rgba(0, 0, 0, 0.6);

    z-index: 1000;
}

.popup {

    position: relative;

    width: min(100%, 340px);

    padding: 24px;

    background: white;

    border-radius: 20px;
}

.close {

    position: absolute;

    top: 10px;
    right: 16px;

    border: none;

    background: transparent;

    font-size: 32px;

    cursor: pointer;
}

.popup-content {

    margin-top: 10px;

    line-height: 1.5;
}

</style>

</head>

<div
    class="overlay"
    id="overlay">

    <div class="popup">

        <button
            class="close">

            ×

        </button>

        <div
            class="popup-content"
            id="popupContent">

        </div>

    </div>

</div>

<script>

const photo =
    document.querySelector(".photo");

const buttons =
    document.querySelectorAll(".image-button");

const overlay =
    document.getElementById("overlay");

const popupContent =
    document.getElementById("popupContent");

const closeButton =
    document.querySelector(".close");

const popupTexts = {

    1: "Текст для первой кнопки.",

    2: "Текст для второй кнопки.",

    3: "Текст для третьей кнопки.",

    4: "Текст для четвертой кнопки.",

    5: "Текст для пятой кнопки.",

    6: "Текст для шестой кнопки."
};

window.addEventListener("load", () => {

    setTimeout(() => {

        photo.classList.add("show");

    }, 300);

    setTimeout(() => {

        buttons.forEach(button => {

            button.classList.add(
                "show-button"
            );

        });

    }, 1400);

});

buttons.forEach(button => {

    button.addEventListener(
        "click",
        () => {

            popupContent.textContent =
                popupTexts[
                    button.dataset.popup
                ];

            overlay.style.display =
                "flex";
        }
    );

});

closeButton.addEventListener(
    "click",
    () => {

        overlay.style.display =
            "none";
    }
);

overlay.addEventListener(
    "click",
    event => {

        if (
            event.target === overlay
        ) {

            overlay.style.display =
                "none";
        }
    }
);

</script>
